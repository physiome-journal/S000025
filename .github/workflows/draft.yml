name: Create Preview Draft from PR
on:
  pull_request:
    branches: ['main']
permissions:
  contents: read
  pull-requests: write
jobs:
  draft:
    uses: curvenote/actions/.github/workflows/draft.yml@v1
    with:
      id-pattern-regex: '^physiome-(?:[a-zA-Z0-9-_]{3,40})$'
      venue: physiome
      collection: articles
      kind: retrospective # This may also be: original, letter, or review
    secrets:
      CURVENOTE: ${{ secrets.CURVENOTE_TOKEN }}
      GITHUB: ${{ secrets.GITHUB_TOKEN }}
